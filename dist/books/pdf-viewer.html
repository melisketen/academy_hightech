<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Reader — Academy High Tech</title>
  <meta name="theme-color" content="#0F172A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="../js/config.js"></script>
  <script src="../js/apiClient.js"></script>
  <script src="../js/utils/navigation.js"></script>
  <script src="../js/utils/scroll.js"></script>
  <script src="../js/components/bookCard.js"></script>
  
  <!-- PDF.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    /* Prevent text selection and copy */
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    
    body {
      background: #0f172a;
      margin: 0;
      color: var(--slate-light);
      font-family: var(--sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Print prevention */
    @media print {
      body {
        display: none !important;
      }
      html {
        display: none !important;
      }
    }

    header.reader-header {
      background: #1e293b;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 1000;
      box-shadow: var(--shadow-md);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: none;
      font-weight: 500;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .book-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 300px;
    }

    .reader-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-ctrl {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-ctrl:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .page-num-indicator {
      font-family: var(--mono);
      font-size: 0.9rem;
    }

    .reader-viewport {
      flex-grow: 1;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem;
      position: relative;
    }

    .canvas-container {
      position: relative;
      background: white;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
    }

    canvas {
      display: block;
    }

    /* Floating Onscreen Watermark to deter photo-taking */
    .screen-watermark {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      justify-items: center;
      align-items: center;
      opacity: 0.07;
      color: black;
      font-size: 1.5rem;
      font-weight: bold;
      transform: rotate(-30deg);
      user-select: none;
      z-index: 10;
    }

    /* Screenshot Blocker Overlay */
    .screenshot-overlay {
      position: fixed;
      inset: 0;
      background: #090d16;
      color: white;
      z-index: 100000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      text-align: center;
    }

    .screenshot-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-title {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--color-error);
      margin-bottom: 1rem;
    }
  </style>
  <link rel="stylesheet" crossorigin href="/assets/main-CRjB44YJ.css">
</head>
<body>

<header class="reader-header">
  <div class="header-left">
    <a href="../library.html" class="btn-back">← Back</a>
    <span class="book-title" id="reader-title">Loading book...</span>
  </div>
  
  <div class="reader-controls">
    <button class="btn-ctrl" id="prev-page-btn" disabled>Prev</button>
    <span class="page-num-indicator"><span id="current-page">0</span> / <span id="total-pages">0</span></span>
    <button class="btn-ctrl" id="next-page-btn" disabled>Next</button>
  </div>
</header>

<main class="reader-viewport" id="viewport">
  <div class="canvas-container" id="canvas-container">
    <canvas id="pdf-canvas"></canvas>
    <div class="screen-watermark" id="watermark-layer">
      <!-- Generated via JS -->
    </div>
  </div>
</main>

<!-- Security Screen Cover when windows loses focus (prevents snipping tools) -->
<div class="screenshot-overlay" id="blocker-overlay">
  <div class="overlay-title">🔐 CONTENT SECURITY LOCKED</div>
  <p>Screenshots, printing, and sharing are disabled.</p>
  <p style="color: var(--slate); font-size: 0.9rem; margin-top: 1rem;">Please return focus to this tab to resume reading.</p>
</div>

<script>
  // Set up PDF.js worker
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  document.addEventListener('DOMContentLoaded', async () => {
    const API = window.APP_CONFIG ? window.APP_CONFIG.API_BASE_URL : 'http://127.0.0.1:8000/api';
    const token = localStorage.getItem('auth_token');
    const userJson = localStorage.getItem('user');
    const user = userJson ? JSON.parse(userJson) : null;

    if (!token || !user) {
      alert('Authentication required.');
      window.location.href = '../auth.html';
      return;
    }

    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const bookId = urlParams.get('bookId');
    if (!bookId) {
      alert('No book ID specified.');
      window.location.href = '../library.html';
      return;
    }

    // Generate floating screen watermarks
    const watermarkLayer = document.getElementById('watermark-layer');
    for (let i = 0; i < 9; i++) {
      const el = document.createElement('div');
      el.textContent = user.email;
      watermarkLayer.appendChild(el);
    }

    // --- PDF RENDERING STATE ---
    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.3;
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');

    // Fetch PDF Stream as ArrayBuffer
    try {
      const response = await fetch(`${API}/books/${bookId}/stream`, {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      if (response.status === 403) {
        alert('Access Denied. You need an active subscription (Standard or Premium) to read this book.');
        window.location.href = '../subscription.html';
        return;
      }

      if (!response.ok) {
        throw new Error('Could not load book stream.');
      }

      const buffer = await response.arrayBuffer();

      // Load PDF.js document representation
      pdfDoc = await pdfjsLib.getDocument({ data: buffer }).promise;
      document.getElementById('total-pages').textContent = pdfDoc.numPages;
      document.getElementById('reader-title').textContent = 'Secure Book Reader';

      // Load initial progress if any
      await fetchInitialProgress();

      // Render page
      renderPage(pageNum);

    } catch (err) {
      console.error(err);
      alert('Error loading document: ' + err.message);
      window.location.href = '../library.html';
    }

    // Fetch any saved progress
    async function fetchInitialProgress() {
      try {
        const res = await fetch(`${API}/books/my-reads`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/json'
          }
        });
        if (res.ok) {
          const data = await res.json();
          const record = data.data.find(r => r.book_id == bookId);
          if (record) {
            pageNum = record.last_read_page || 1;
          }
        }
      } catch (err) {
        console.error('Error fetching progress:', err);
      }
    }

    // Render specified page
    function renderPage(num) {
      pageRendering = true;
      pdfDoc.getPage(num).then((page) => {
        const viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };
        const renderTask = page.render(renderContext);

        renderTask.promise.then(() => {
          pageRendering = false;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });

        // Update UI
        document.getElementById('current-page').textContent = num;
        document.getElementById('prev-page-btn').disabled = (num <= 1);
        document.getElementById('next-page-btn').disabled = (num >= pdfDoc.numPages);

        // Sync progress with backend — debounced by default
        const progressPercentage = Math.round((num / pdfDoc.numPages) * 100 * 10) / 10;
        window.updateReadingProgress(bookId, num, progressPercentage, false);
      });
    }


    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    // Controls listeners
    document.getElementById('prev-page-btn').addEventListener('click', () => {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    });

    document.getElementById('next-page-btn').addEventListener('click', () => {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    });

    // Save progress when user closes the tab / navigates away
    window.addEventListener('beforeunload', () => {
      if (pdfDoc) {
        const pct = Math.round((pageNum / pdfDoc.numPages) * 100 * 10) / 10;
        window.updateReadingProgress(bookId, pageNum, pct, true);
      }
    });

    // Prevent dragging the PDF canvas (screenshot workaround)
    document.addEventListener('dragstart', e => e.preventDefault());



    // --- SECURITY PROTOCOLS (Anti-Screenshot) ---

    // 1. Disable Right Click
    document.addEventListener('contextmenu', e => e.preventDefault());

    // 2. Disable Keyboard Shortcuts (Copy, Save, Print, DevTools)
    window.addEventListener('keydown', (e) => {
      // Ctrl+S
      if (e.ctrlKey && e.key === 's') {
        e.preventDefault();
      }
      // Ctrl+P / Cmd+P
      if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
        e.preventDefault();
        triggerBlockOverlay();
      }
      // Ctrl+C / Ctrl+X
      if (e.ctrlKey && (e.key === 'c' || e.key === 'x')) {
        e.preventDefault();
      }
      // F12 or Inspect keys combo
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J'))) {
        e.preventDefault();
      }
      // PrintScreen key — show overlay for 2 seconds
      if (e.key === 'PrintScreen') {
        e.preventDefault();
        triggerBlockOverlay(2000);
      }
    });

    // 3. Block browser print dialog (Ctrl+P, Cmd+P, File > Print)
    window.onbeforeprint = () => {
      triggerBlockOverlay(2000);
    };



    // 3. Blur / Window Focus Loss Blocker (Highly effective against snippet/capturing tools)
    const overlay = document.getElementById('blocker-overlay');

    window.addEventListener('blur', () => {
      triggerBlockOverlay();
    });

    window.addEventListener('focus', () => {
      removeBlockOverlay();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        triggerBlockOverlay();
      } else {
        removeBlockOverlay();
      }
    });

    function triggerBlockOverlay(minDurationMs = 0) {
      overlay.classList.add('active');
      if (minDurationMs > 0) {
        // Keep overlay up for the specified duration even if focus returns
        overlay._minTimeout = setTimeout(() => {
          overlay._minTimeout = null;
        }, minDurationMs);
      }
    }

    function removeBlockOverlay() {
      // Don't remove if a minimum-duration timer is still running
      if (overlay._minTimeout) return;
      // Add a slight delay to allow screenshot tools to close
      setTimeout(() => {
        overlay.classList.remove('active');
      }, 500);
    }

  });
</script>
</body>
</html>
